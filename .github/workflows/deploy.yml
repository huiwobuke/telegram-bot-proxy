name: Deploy Telegram Proxy to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      
      - name: Deploy to Vercel
        run: vercel deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      
      - name: Output URL
        run: |
          echo "==========================================="
          echo "Telegram Bot API Proxy URL:"
          echo "https://telegram-bot-proxy.vercel.app"
          echo "==========================================="
          echo "在 CNB 运行:"
          echo "hermes config set platforms.telegram.base_url https://telegram-bot-proxy.vercel.app/bot"
          echo "hermes gateway restart"
